<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategic X - Join a Shop</title>
  <style>
    :root {
      --black: #0a0a0a;
      --silver: #c7c9cc;
      --silver-light: #e5e6e8;
      --silver-dark: #8a8d91;
      --border: #dcdde0;
      --text: #111113;
      --text-muted: #6b6f76;
      --bg: #f5f5f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      line-height: 1.4;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    a { text-decoration: none; color: inherit; }

    .join-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 18px;
      padding: 34px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .join-logo {
      width: 120px;
      height: auto;
      object-fit: contain;
      margin-bottom: 22px;
    }

    .join-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .join-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    .join-form {
      text-align: left;
    }

    .join-field {
      margin-bottom: 16px;
    }

    .join-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .join-field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
    }

    .join-field input:focus {
      outline: none;
      border-color: var(--silver-dark);
    }

    #inviteCodeInput {
      text-transform: uppercase;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.06em;
    }

    .btn-join {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, #2b2b2d, #000000);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      letter-spacing: 0.01em;
      margin-top: 6px;
    }

    .btn-join:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-join:not(:disabled):hover {
      background: linear-gradient(180deg, #3a3a3c, #0a0a0a);
    }

    .join-error {
      background: #fdecea;
      border: 1px solid #f3c2bd;
      color: #b3261e;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    /* ---- Status card (already joined) ---- */
    .status-check {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--silver-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 18px;
    }

    .status-shop-logo {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      margin: 0 auto 12px;
      display: block;
    }

    .status-shop-name {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .status-text {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .status-pending-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #8a6400;
      background: #fdf1cf;
      border-radius: 999px;
      padding: 5px 14px;
      margin-bottom: 22px;
    }

    .status-role-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--black);
      border-radius: 999px;
      padding: 5px 14px;
      margin-bottom: 22px;
    }

    .btn-outline {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      color: var(--text);
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .btn-outline:hover {
      background: var(--bg);
    }
  </style>
</head>
<body>
  <div class="join-card" id="joinCard">
    <img class="join-logo" src="assets/sxlogo.png" alt="Strategic X logo" />
    <div class="join-title">Join as Staff or Manager</div>
    <p class="join-subtitle">Enter the invitation code you received from a shop owner.</p>

    <p class="join-error" id="joinError" hidden></p>

    <form class="join-form" id="joinForm">
      <div class="join-field">
        <label for="fullNameInput">Your Full Name</label>
        <input type="text" id="fullNameInput" name="fullName" placeholder="e.g. Tunde Adewale" required />
      </div>
      <div class="join-field">
        <label for="inviteCodeInput">Invitation Code</label>
        <input type="text" id="inviteCodeInput" name="inviteCode" placeholder="SX-XXXXXX" required />
      </div>
      <button type="submit" class="btn-join" id="joinBtn">Join Shop</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="sx-supabase-config.js"></script>
  <script src="sx-auth.js?v=13"></script>
  <script>
    var joinCard = document.getElementById('joinCard');
    var currentUser = null;

    function showJoinError(message) {
      var errorEl = document.getElementById('joinError');
      if (!message) {
        errorEl.hidden = true;
        errorEl.textContent = '';
        return;
      }
      errorEl.hidden = false;
      errorEl.textContent = message;
    }

    (async function guardStaffJoin() {
      var sessionResult = await sxSupabaseClient.auth.getSession();
      var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;
      if (!session) {
        window.location.href = 'sign-in.html';
        return;
      }
      currentUser = session.user;

      var meta = currentUser.user_metadata || {};
      var fullNameInput = document.getElementById('fullNameInput');
      if (fullNameInput && meta.sx_full_name) fullNameInput.value = meta.sx_full_name;

      // Already joined a shop on a previous visit? Skip straight to the
      // staff dashboard instead of asking them to enter a code again.
      var membershipResult = await sxSupabaseClient
        .from('sx_shop_members')
        .select('id')
        .eq('user_id', currentUser.id)
        .maybeSingle();

      if (membershipResult && membershipResult.data) {
        window.location.href = 'dashboard.html';
      }
    })();

    document.getElementById('joinForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      showJoinError('');

      var fullName = document.getElementById('fullNameInput').value.trim();
      var inviteCode = document.getElementById('inviteCodeInput').value.trim();
      var joinBtn = document.getElementById('joinBtn');

      joinBtn.disabled = true;
      joinBtn.textContent = 'Joining...';
      try {
        var rpcResult = await sxSupabaseClient.rpc('sx_join_shop_by_code', {
          p_invite_code: inviteCode,
          p_full_name: fullName
        });

        if (rpcResult.error) {
          showJoinError(rpcResult.error.message || 'Unable to join this shop. Please check your invitation code.');
          return;
        }

        await sxSupabaseClient.auth.updateUser({
          data: { sx_onboarded: true, sx_shop_role: 'staff', sx_full_name: fullName }
        });

        // Go straight into the shared dashboard, already signed in — no
        // extra "back to sign in" detour. Role assignment happens later,
        // from inside the dashboard's pending-role status badge.
        window.location.href = 'dashboard.html';
      } catch (err) {
        showJoinError('Something went wrong. Please try again.');
        joinBtn.disabled = false;
        joinBtn.textContent = 'Join Shop';
      }
    });
  </script>
</body>
</html>
